services:
  parrot:
    image: ghcr.io/lco117/parrot-llm:latest
    # build: .            # uncomment to build locally instead of pulling
    restart: unless-stopped
    environment:
      PARROT_TEXT: "6"
      PARROT_MODE: echo
      PARROT_TPS: "100"
      # PARROT_LOG: summary
      # PARROT_API_KEY: sk-parrot
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # set this in a .env file next to this compose file
      PARROT_DOMAIN: ${PARROT_DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
