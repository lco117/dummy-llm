services:
  dummy:
    image: ghcr.io/lco117/dummy-llm:latest
    # build: .            # uncomment to build locally instead of pulling
    restart: unless-stopped
    environment:
      DUMMY_TEXT: "6"
      DUMMY_MODE: echo
      DUMMY_TPS: "100"
      # DUMMY_LOG: summary
      # DUMMY_API_KEY: sk-dummy
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # set this in a .env file next to this compose file
      DUMMY_DOMAIN: ${DUMMY_DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
