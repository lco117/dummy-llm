services:
  npc:
    image: ghcr.io/lco117/npc-llm:latest
    # build: .            # uncomment to build locally instead of pulling
    restart: unless-stopped
    environment:
      NPC_TEXT: "6"
      NPC_MODE: echo
      NPC_TPS: "100"
      # NPC_LOG: summary
      # NPC_API_KEY: sk-npc
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # set this in a .env file next to this compose file
      NPC_DOMAIN: ${NPC_DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
